<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clasificador de Residuos</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 480px;
            backdrop-filter: blur(20px);
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 28px;
        }

        .header { text-align: center; }
        .header .icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        .header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #f1f5f9;
            letter-spacing: -0.5px;
        }
        .header p {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-top: 6px;
        }

        .camera-wrapper {
            position: relative;
            width: 320px;
            height: 320px;
            border-radius: 18px;
            overflow: hidden;
            background: #0f172a;
            border: 2px solid rgba(255,255,255,0.08);
            display: none;
        }
        .camera-wrapper.visible { display: block; }

        .camera-wrapper canvas {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover;
            display: block;
        }

        .camera-overlay {
            position: absolute;
            inset: 0;
            border-radius: 18px;
            border: 2px solid transparent;
            background: linear-gradient(#0f172a, #0f172a) padding-box,
                        linear-gradient(135deg, #6366f1, #22d3ee) border-box;
            pointer-events: none;
        }

        .placeholder {
            width: 320px;
            height: 320px;
            border-radius: 18px;
            background: rgba(255,255,255,0.03);
            border: 2px dashed rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: #475569;
        }
        .placeholder .ph-icon { font-size: 3rem; }
        .placeholder span { font-size: 0.85rem; }
        .placeholder.hidden { display: none; }

        .result-box {
            width: 100%;
            min-height: 72px;
            background: rgba(99,102,241,0.12);
            border: 1px solid rgba(99,102,241,0.3);
            border-radius: 14px;
            padding: 16px 20px;
            display: none;
            align-items: center;
            gap: 14px;
        }
        .result-box.visible { display: flex; }

        .result-icon {
            font-size: 2rem;
            flex-shrink: 0;
        }
        .result-text { flex: 1; }
        .result-label {
            font-size: 0.72rem;
            font-weight: 500;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        .result-class {
            font-size: 1.2rem;
            font-weight: 700;
            color: #f1f5f9;
            margin-top: 2px;
        }
        .result-confidence {
            font-size: 0.82rem;
            color: #6366f1;
            font-weight: 500;
            margin-top: 2px;
        }

        .confidence-bar {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.08);
            border-radius: 99px;
            overflow: hidden;
            margin-top: 8px;
        }
        .confidence-fill {
            height: 100%;
            background: linear-gradient(90deg, #6366f1, #22d3ee);
            border-radius: 99px;
            transition: width 0.3s ease;
            width: 0%;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-primary {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: #fff;
            box-shadow: 0 4px 20px rgba(99,102,241,0.35);
        }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 24px rgba(99,102,241,0.5); }
        .btn-primary:active { transform: translateY(0); }
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-stop {
            background: rgba(239,68,68,0.12);
            border: 1px solid rgba(239,68,68,0.3);
            color: #f87171;
            display: none;
        }
        .btn-stop:hover { background: rgba(239,68,68,0.2); }
        .btn-stop.visible { display: block; }

        .error-box {
            width: 100%;
            background: rgba(239,68,68,0.1);
            border: 1px solid rgba(239,68,68,0.3);
            border-radius: 12px;
            padding: 12px 16px;
            color: #fca5a5;
            font-size: 0.82rem;
            display: none;
        }
        .error-box.visible { display: block; }

        .loading-dot {
            display: inline-block;
            animation: blink 1.2s infinite;
        }
        .loading-dot:nth-child(2) { animation-delay: 0.2s; }
        .loading-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink {
            0%, 80%, 100% { opacity: 0.2; }
            40% { opacity: 1; }
        }

        .status-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #22c55e;
            box-shadow: 0 0 6px #22c55e;
            animation: pulse 2s infinite;
            display: none;
        }
        .status-dot.visible { display: inline-block; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .camera-header {
            display: none;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            color: #94a3b8;
            font-weight: 500;
            width: 100%;
        }
        .camera-header.visible { display: flex; }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <div class="icon">♻️</div>
            <h1>Clasificador de Residuos</h1>
            <p>Apunta la cámara a un objeto para identificarlo</p>
        </div>

        <div class="placeholder" id="placeholder">
            <div class="ph-icon">📷</div>
            <span>La cámara aparecerá aquí</span>
        </div>

        <div class="camera-header" id="camera-header">
            <div class="status-dot visible" id="status-dot"></div>
            <span>Cámara activa</span>
        </div>

        <div class="camera-wrapper" id="webcam-container"></div>

        <div class="result-box" id="label-container">
            <div class="result-icon" id="result-icon">🗑️</div>
            <div class="result-text">
                <div class="result-label">Residuo detectado</div>
                <div class="result-class" id="result-class">—</div>
                <div class="result-confidence" id="result-confidence">—</div>
                <div class="confidence-bar"><div class="confidence-fill" id="confidence-fill"></div></div>
            </div>
        </div>

        <div class="error-box" id="error-container"></div>

        <button class="btn btn-primary" id="btn-start" onclick="init()">Iniciar Cámara</button>
        <button class="btn btn-stop" id="btn-stop" onclick="stop()">Detener Cámara</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
